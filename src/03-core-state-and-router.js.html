function go(name){
  if (name === "pneuma-intro"){ renderPneumaIntro(); name = "pneuma"; }
  else if (name === "logos-intro"){ renderLogosIntro(); name = "logos"; }
  else if (name === "typology"){ quizIntro(TYPOLOGY); }
  else if (name === "soulq"){ quizIntro(SOULIQ); }
  else if (name === "body"){ quizIntro(BODYIQ); }
  else if (name === "doors"){ quizIntro(NINEDOORS); }
  else if (name === "past"){ State.past ? renderPastSummary() : renderPastIntro(); }
  else if (name === "readings"){ renderReadings(); wireReadings(); }
  else if (name === "tarot"){
    const g = tarotReady();
    if (!g.ok){ VIEWS.forEach(v => { const el = $("#view-"+v); if (el) el.hidden = (v !== "tarot"); });
      $("#view-tarot").innerHTML = tarotGateScreen(g); State.view = "tarot"; window.scrollTo({top:0}); return; }
    renderTarot();
  }
  else if (name === "trials"){ renderTrials(); }
  else if (name === "blueprint"){ renderBlueprint(); }
  else if (name === "onboard"){ renderOnboard(1); }
  else if (name === "journey"){ renderJourney(); }
  else if (name === "anima" || name === "anima-intro"){ if (!State.anima || name === "anima-intro") renderAnimaIntro(); else renderAnimaSummary(); name = "anima"; }
  else if (name === "results"){ renderResults(); }
  else if (name === "oracle"){ renderOracle(); }
  else if (name === "essays"){ renderEssayList(); }
  if (!VIEWS.includes(name)) name = "home";
  State.view = name;
  VIEWS.forEach(v => { const el = $("#view-"+v); if (el) el.hidden = (v !== name); });
  $$("[data-go]").forEach(b => {
    const target = b.dataset.go.replace("-intro","");
    if (b.closest(".nav") || b.closest(".tabbar")) b.setAttribute("aria-current", target === name ? "page" : "false");
  });
  window.scrollTo({top:0, behavior:"instant"});
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go]");
  if (b){ e.preventDefault(); go(b.dataset.go); }
});

/* ---------------- modals ---------------- */
function modal(html, opts={}){
  closeModal();
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = '<div class="frame modal__box"><button class="modal__x" aria-label="Close">×</button>'+html+'</div>';
  wrap.addEventListener("click", e => { if (e.target === wrap && !opts.sticky) closeModal(); });
  wrap.querySelector(".modal__x").addEventListener("click", closeModal);
  $("#modal-root").appendChild(wrap);
  document.addEventListener("keydown", escClose);
  return wrap;
}
function escClose(e){ if (e.key === "Escape") closeModal(); }
function closeModal(){ $("#modal-root").innerHTML = ""; document.removeEventListener("keydown", escClose); }

    '<button class="btn btn--gold btn--wide" id="m-one">Pay $3.99</button>'+

/* ---------------- toast ---------------- */
let toastT;
function toast(msg){
  let t = $("#toast");
  if (!t){ t = document.createElement("div"); t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:120px;z-index:90;padding:13px 20px;border:1px solid var(--gold-line);background:rgba(10,14,36,.97);color:var(--gold-hi);font:600 11px/1.5 Inter,sans-serif;letter-spacing:.1em;max-width:min(440px,92vw);text-align:center;border-radius:2px;box-shadow:0 20px 50px -20px #000";
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity = "1";
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.transition="opacity .5s"; t.style.opacity="0"; }, 3800);
}
